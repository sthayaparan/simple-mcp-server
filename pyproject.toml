[project]
name = "member-mcp"
version = "0.1.0"
description = "Streamable HTTP Member MCP Server (FastAPI + FastMCP)"
readme = "README.md"
authors = [
    { name = "thayaparan", email = "subram.thayaparan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=4.0.10",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pylint.main]
source-roots = ["src"]
